<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Quest – Field Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="math-quest.css">
</head>
<body>
  <header class="main-header">
    <div class="header-inner">
      <div class="brand">
        <span class="mascot">🦊</span>
        <div>
          <h1>Math Quest</h1>
          <span class="tag">Discover magical creatures</span>
        </div>
      </div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="map.html">Map</a>
        <a href="practice.html">Practice</a>
        <a href="field-guide.html" class="active">Field Guide</a>
      </nav>
    </div>
  </header>

  <main class="guide-container">
    <h2 style="text-align:center; font-family: 'Fredoka', sans-serif;">📖 Explorer’s Field Guide</h2>
    <p style="text-align:center;">Unlock locations on the map to discover these rare jungle creatures.</p>
    <div id="emptyMessage" style="text-align:center; margin:2rem; font-size:1.1rem;"></div>
    <div id="guideGrid" class="guide-grid"></div>
  </main>

  <footer class="main-footer">
    <p>© 2026 Math Quest · Gotta discover 'em all!</p>
  </footer>

  <script>
    const CREATURES = [
      { name: 'Glowbat', emoji: '🦇', fact: 'This bat uses echolocation to find prime numbers!' },
      { name: 'Mudpuppy', emoji: '🐶', fact: 'It can sense right angles with its whiskers!' },
      { name: 'Vine Snake', emoji: '🐍', fact: 'Its scales are perfect fractals.' },
      { name: 'Sun Phoenix', emoji: '🐦‍🔥', fact: 'Rebirths when you solve a geometry problem.' },
      { name: 'Echo Fox', emoji: '🦊', fact: 'It repeats your answer, then tells you if it’s right.' },
      { name: 'Lavahorn', emoji: '🐲', fact: 'It can calculate the percent of lava in its belly.' },
      { name: 'Bookwyrm', emoji: '🐉', fact: 'It eats quadratic equations for breakfast.' },
      { name: 'Celestial Turtle', emoji: '🐢', fact: 'Its shell contains a map of the stars.' }
    ];

    function getDiscoveredCreatures() {
      return JSON.parse(localStorage.getItem('discoveredCreatures')) || [];
    }

    function renderFieldGuide() {
      const grid = document.getElementById('guideGrid');
      const emptyMsg = document.getElementById('emptyMessage');
      const discovered = getDiscoveredCreatures();

      // Show a friendly message if nothing discovered
      if (discovered.length === 0) {
        emptyMsg.innerHTML = '🌿 You haven’t discovered any creatures yet.<br>Complete a puzzle chain on the <a href="map.html">Quest Map</a> to find your first one!';
      } else {
        emptyMsg.innerHTML = `You’ve discovered ${discovered.length} of ${CREATURES.length} creatures. Keep exploring!`;
      }

      grid.innerHTML = '';
      CREATURES.forEach(creature => {
        const isDiscovered = discovered.includes(creature.name);
        const card = document.createElement('div');
        card.className = 'guide-card' + (isDiscovered ? ' discovered' : '');
        card.innerHTML = `
          <div class="creature-img">${isDiscovered ? creature.emoji : '❓'}</div>
          <div class="creature-name">${isDiscovered ? creature.name : '???'}</div>
          ${isDiscovered ? `<div class="creature-fact">${creature.fact}</div>` : ''}
        `;
        grid.appendChild(card);
      });
    }

    renderFieldGuide();
  </script>
</body>
</html>
