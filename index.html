<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Quest – Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="math-quest.css">
</head>
<body>
  <!-- Header -->
  <header class="main-header">
    <div class="header-inner">
      <div class="brand">
        <span class="mascot">🦊</span>
        <div>
          <h1>Math Quest</h1>
          <span class="tag">Solve it. Earn it. Level up.</span>
        </div>
      </div>
      <nav class="nav">
        <a href="index.html" class="active">Home</a>
        <a href="practice.html">Practice</a>
        <a href="#" onclick="alert('Coming soon!')">Leaderboard</a>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <main class="hero">
    <div class="hero-card">
      <h2>Welcome, young mathematician!</h2>
      <p>Sharpen your skills, earn coins, and become a math champion.</p>

      <div id="loginArea">
        <div id="welcomeBack" style="display:none;">
          <p>Welcome back, <strong id="savedName"></strong>!</p>
          <a href="practice.html" class="btn btn-start">▶ Continue Practice</a>
          <button id="changeNameBtn" class="btn btn-secondary">Change Name</button>
        </div>

        <div id="nameForm">
          <label for="nameInput">Enter your name to start your quest:</label>
          <input type="text" id="nameInput" placeholder="e.g. Alex" maxlength="15">
          <button id="startBtn" class="btn btn-start">🚀 Start Practice</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="main-footer">
    <p>© 2026 Math Quest · Learn mathematics the fun way!</p>
  </footer>

  <script>
    const savedName = localStorage.getItem('mathQuestName');

    function showWelcomeBack(name) {
      document.getElementById('welcomeBack').style.display = 'block';
      document.getElementById('savedName').textContent = name;
      document.getElementById('nameForm').style.display = 'none';
    }

    function showNameForm() {
      document.getElementById('welcomeBack').style.display = 'none';
      document.getElementById('nameForm').style.display = 'block';
    }

    if (savedName) {
      showWelcomeBack(savedName);
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      const name = document.getElementById('nameInput').value.trim();
      if (!name) {
        alert('Please enter your name first!');
        return;
      }
      localStorage.setItem('mathQuestName', name);
      window.location.href = 'practice.html';
    });

    document.getElementById('changeNameBtn').addEventListener('click', () => {
      showNameForm();
      document.getElementById('nameInput').value = '';
      document.getElementById('nameInput').focus();
    });
  </script>
</body>
</html>
