<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --jungle: #1B4332;
    --jungle-deep: #10281c;
    --gold: #FFC145;
    --gold-deep: #E8A722;
    --teal: #4ECDC4;
    --coral: #FF6B6B;
    --parchment: #FFF8E7;
    --parchment-shadow: #E9DFC4;
    --ink: #3A2E1F;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 10%, #2d5a45 0%, transparent 40%),
      radial-gradient(circle at 85% 85%, #2d5a45 0%, transparent 45%),
      var(--jungle);
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }

  .wrap { width: 100%; max-width: 620px; }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand .mascot {
    font-size: 2.4rem;
    filter: drop-shadow(0 3px 0 rgba(0,0,0,0.25));
  }
  .brand h1 {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.7rem;
    color: var(--gold);
    margin: 0;
    letter-spacing: 0.5px;
  }
  .brand .tag {
    display: block;
    font-size: 0.78rem;
    color: #cfe8da;
    font-weight: 600;
  }

  .hud {
    display: flex;
    gap: 10px;
  }
  .hud-pill {
    background: var(--jungle-deep);
    border: 2px solid #2d5a45;
    border-radius: 999px;
    padding: 8px 14px;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    color: var(--gold);
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 84px;
    justify-content: center;
  }

  /* ---------- Class picker ---------- */
  .class-picker {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .class-chip {
    flex: 1 1 auto;
    min-width: 90px;
    background: var(--jungle-deep);
    border: 2px solid #2d5a45;
    color: #cfe8da;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 10px 14px;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .class-chip:hover { transform: translateY(-2px); }
  .class-chip:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
  .class-chip.active {
    background: var(--gold);
    border-color: var(--gold-deep);
    color: var(--ink);
  }

  /* ---------- Timer torch bar ---------- */
  .torch-track {
    height: 14px;
    border-radius: 999px;
    background: var(--jungle-deep);
    border: 2px solid #2d5a45;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .torch-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, var(--teal), #7fe0d8);
    transition: width 1s linear, background 0.4s ease;
  }
  .torch-fill.warn { background: linear-gradient(90deg, var(--gold), #ffd97a); }
  .torch-fill.danger { background: linear-gradient(90deg, var(--coral), #ff9a9a); }

  /* ---------- Question scroll ---------- */
  .scroll-card {
    background: var(--parchment);
    border-radius: 18px;
    padding: 34px 24px;
    text-align: center;
    box-shadow: 0 10px 0 var(--parchment-shadow), 0 14px 24px rgba(0,0,0,0.25);
    margin-bottom: 20px;
    position: relative;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scroll-card .q-text {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.9rem;
    color: var(--ink);
    letter-spacing: 0.5px;
    word-break: break-word;
  }
  .scroll-card .hint {
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    color: #8a7a5c;
  }

  /* ---------- Options ---------- */
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 18px;
  }
  .opt-btn {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.15rem;
    font-weight: 600;
    padding: 18px 10px;
    border-radius: 14px;
    border: none;
    background: var(--parchment);
    color: var(--ink);
    box-shadow: 0 6px 0 var(--parchment-shadow);
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
  }
  .opt-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .opt-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--parchment-shadow); }
  .opt-btn:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
  .opt-btn:disabled { cursor: default; opacity: 0.85; }
  .opt-btn.selected { background: #dce9ff; box-shadow: 0 6px 0 #b7cdf0; }
  .opt-btn.correct { background: var(--teal); color: #073b36; box-shadow: 0 6px 0 #2f9e96; }
  .opt-btn.wrong { background: var(--coral); color: #4a0f0f; box-shadow: 0 6px 0 #d94f4f; }

  /* ---------- Actions ---------- */
  .actions {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }
  .btn {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    border: none;
    border-radius: 12px;
    padding: 13px 18px;
    cursor: pointer;
    flex: 1;
    transition: transform 0.08s ease;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
  .btn-primary { background: var(--gold); color: var(--ink); }
  .btn-secondary { background: transparent; color: var(--gold); border: 2px solid var(--gold); }

  /* ---------- Feedback ---------- */
  .feedback {
    min-height: 28px;
    text-align: center;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 1.05rem;
    color: var(--parchment);
    margin-bottom: 6px;
  }
  .solution {
    background: var(--jungle-deep);
    border: 2px dashed #3d6b52;
    border-radius: 12px;
    padding: 14px 16px;
    color: #d8f3e6;
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    white-space: pre-wrap;
    margin-bottom: 22px;
    display: none;
  }
  .solution.show { display: block; }

  /* ---------- Chest ---------- */
  .chest-zone {
    text-align: center;
    font-size: 2.4rem;
    height: 44px;
    margin-bottom: 14px;
  }
  .chest-zone span { display: inline-block; }
  @keyframes pop {
    0% { transform: scale(0.4) translateY(10px); opacity: 0; }
    60% { transform: scale(1.15) translateY(-4px); opacity: 1; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  .pop { animation: pop 0.5s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .shake { animation: shake 0.35s ease; }

  /* ---------- Trail ---------- */
  .trail-label {
    font-family: 'Fredoka', sans-serif;
    color: #cfe8da;
    font-size: 0.85rem;
    margin-bottom: 6px;
  }
  .trail {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .step {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--jungle-deep);
    border: 2px solid #2d5a45;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
  }
  .step.good { background: var(--teal); border-color: #2f9e96; }
  .step.bad { background: var(--coral); border-color: #d94f4f; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <span class="mascot">🦊</span>
      <div>
        <h1>Math Quest</h1>
        <span class="tag">Solve it. Earn it. Level up.</span>
      </div>
    </div>
    <div class="hud">
      <div class="hud-pill">⏱ <span id="timerText">20</span>s</div>
      <div class="hud-pill">🪙 <span id="scoreText">0</span></div>
    </div>
  </header>

  <div class="class-picker" id="classPicker">
    <button class="class-chip" data-class="3">Class 3</button>
    <button class="class-chip" data-class="5">Class 5</button>
    <button class="class-chip" data-class="8">Class 8</button>
    <button class="class-chip" data-class="10">Class 10</button>
  </div>

  <div class="torch-track"><div class="torch-fill" id="torchFill"></div></div>

  <div class="scroll-card">
    <div>
      <div class="q-text" id="qText">Pick a class to begin your quest!</div>
    </div>
  </div>

  <div class="options" id="optionsGrid"></div>

  <div class="chest-zone" id="chestZone"></div>

  <div class="actions">
    <button class="btn btn-primary" id="newQBtn">🎲 New Question</button>
    <button class="btn btn-secondary" id="submitBtn" disabled>✅ Submit</button>
  </div>

  <div class="feedback" id="feedback"></div>
  <div class="solution" id="solution"></div>

  <div class="trail-label">Your quest trail</div>
  <div class="trail" id="trail"></div>

</div>

<script>
(function () {
  const TIME_LIMIT = 20;
  let currentClass = null;
  let correctAnswer = null;
  let currentQuestion = "";
  let timeLeft = TIME_LIMIT;
  let timerId = null;
  let score = 0;
  let history = [];
  let locked = true;

  const qText = document.getElementById('qText');
  const optionsGrid = document.getElementById('optionsGrid');
  const timerText = document.getElementById('timerText');
  const scoreText = document.getElementById('scoreText');
  const torchFill = document.getElementById('torchFill');
  const newQBtn = document.getElementById('newQBtn');
  const submitBtn = document.getElementById('submitBtn');
  const feedback = document.getElementById('feedback');
  const solutionBox = document.getElementById('solution');
  const chestZone = document.getElementById('chestZone');
  const trail = document.getElementById('trail');

  document.querySelectorAll('.class-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.class-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentClass = chip.dataset.class;
      startNewQuestion();
    });
  });

  newQBtn.addEventListener('click', startNewQuestion);
  submitBtn.addEventListener('click', () => lockIn(getSelected()));

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function distractors(correctVal, count) {
    const out = new Set();
    let tries = 0;
    while (out.size < count && tries < 60) {
      tries++;
      const offset = [1,2,3,5,10][randInt(0,4)] * (Math.random() < 0.5 ? -1 : 1);
      const val = correctVal + offset;
      if (val !== correctVal) out.add(String(val));
    }
    return Array.from(out);
  }

  function genArithmetic(level) {
    let a, b, op, text, result;
    if (level === "3") {
      a = randInt(1, 20); b = randInt(1, 20);
      op = ["+", "-", "×"][randInt(0, 2)];
    } else {
      a = randInt(10, 100); b = randInt(2, 12);
      op = ["+", "-", "×", "÷"][randInt(0, 3)];
      if (op === "÷") a = a * b;
    }
    switch (op) {
      case "+": result = a + b; break;
      case "-": result = a - b; break;
      case "×": result = a * b; break;
      case "÷": result = a / b; break;
    }
    text = `${a} ${op} ${b}`;
    const solutionSteps = `Step 1: Compute ${text}\nStep 2: Result = ${result}`;
    return { text, correct: String(result), solutionSteps };
  }

  function genLinear() {
    const root = randInt(-10, 10);
    const coeff = randInt(1, 9);
    const cnst = randInt(-20, 20);
    const rhs = coeff * root + cnst;
    const cnstStr = cnst >= 0 ? `+ ${cnst}` : `- ${Math.abs(cnst)}`;
    const text = `${coeff}x ${cnstStr} = ${rhs}`;
    const solutionSteps =
      `Step 1: ${coeff}x = ${rhs} ${cnst >= 0 ? "-" : "+"} ${Math.abs(cnst)}\n` +
      `Step 2: ${coeff}x = ${rhs - cnst}\n` +
      `Step 3: x = ${root}`;
    return { text, correct: String(root), solutionSteps };
  }

  function genQuadratic() {
    const r1 = randInt(-8, 8);
    const r2 = randInt(-8, 8);
    const b = -(r1 + r2);
    const c = r1 * r2;
    const bStr = b >= 0 ? `+ ${b}x` : `- ${Math.abs(b)}x`;
    const cStr = c >= 0 ? `+ ${c}` : `- ${Math.abs(c)}`;
    const text = `x² ${bStr} ${cStr} = 0`;
    const roots = [r1, r2].sort((x, y) => x - y);
    const correct = roots.join(", ");
    const solutionSteps =
      `Step 1: Factor -> (x - ${r1})(x - ${r2}) = 0\n` +
      `Step 2: Set each factor to zero\n` +
      `Step 3: x = ${correct}`;
    return { text, correct, solutionSteps };
  }

  function genQuadraticDistractor() {
    const r1 = randInt(-8, 8), r2 = randInt(-8, 8);
    return [r1, r2].sort((x, y) => x - y).join(", ");
  }

  function buildQuestion(level) {
    if (level === "3" || level === "5") {
      const q = genArithmetic(level);
      const opts = shuffle([...distractors(Number(q.correct), 3), q.correct]);
      return { ...q, options: opts };
    } else if (level === "8") {
      const q = genLinear();
      const opts = shuffle([...distractors(Number(q.correct), 3), q.correct]);
      return { ...q, options: opts };
    } else {
      const q = genQuadratic();
      const opts = new Set([q.correct]);
      let tries = 0;
      while (opts.size < 4 && tries < 60) {
        tries++;
        opts.add(genQuadraticDistractor());
      }
      return { ...q, options: shuffle(Array.from(opts)) };
    }
  }

  let currentSolution = "";

  function startNewQuestion() {
    if (!currentClass) return;
    clearInterval(timerId);
    const q = buildQuestion(currentClass);
    currentQuestion = q.text;
    correctAnswer = q.correct;
    currentSolution = q.solutionSteps;

    qText.textContent = q.text;
    renderOptions(q.options);
    feedback.textContent = "";
    solutionBox.classList.remove('show');
    solutionBox.textContent = "";
    chestZone.innerHTML = "";
    locked = false;
    submitBtn.disabled = true;

    timeLeft = TIME_LIMIT;
    updateTorch();
    timerId = setInterval(tick, 1000);
  }

  function renderOptions(options) {
    optionsGrid.innerHTML = "";
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = opt;
      btn.dataset.value = opt;
      btn.addEventListener('click', () => selectOption(btn));
      optionsGrid.appendChild(btn);
    });
  }

  function selectOption(btn) {
    if (locked) return;
    document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    submitBtn.disabled = false;
  }

  function getSelected() {
    const sel = document.querySelector('.opt-btn.selected');
    return sel ? sel.dataset.value : null;
  }

  function tick() {
    timeLeft -= 1;
    updateTorch();
    if (timeLeft <= 0) {
      clearInterval(timerId);
      lockIn(getSelected(), true);
    }
  }

  function updateTorch() {
    timerText.textContent = Math.max(timeLeft, 0);
    const pct = Math.max(timeLeft / TIME_LIMIT, 0) * 100;
    torchFill.style.width = pct + "%";
    torchFill.classList.remove('warn', 'danger');
    if (timeLeft <= 5) torchFill.classList.add('danger');
    else if (timeLeft <= 10) torchFill.classList.add('warn');
  }

  function lockIn(selected, timedOut) {
    if (locked) return;
    locked = true;
    clearInterval(timerId);
    submitBtn.disabled = true;
    document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);

    const isCorrect = selected === correctAnswer;
    document.querySelectorAll('.opt-btn').forEach(b => {
      if (b.dataset.value === correctAnswer) b.classList.add('correct');
      else if (b.dataset.value === selected) b.classList.add('wrong');
    });

    history.push(isCorrect ? 1 : 0);
    renderTrail();

    if (isCorrect) {
      score += 1;
      scoreText.textContent = score;
      feedback.textContent = "🎉 Correct! Treasure collected!";
      chestZone.innerHTML = '<span class="pop">🎁✨🪙</span>';
    } else if (timedOut && !selected) {
      feedback.textContent = `⏰ Time's up! The answer was ${correctAnswer}`;
      chestZone.innerHTML = '<span class="pop">🔒</span>';
    } else {
      feedback.textContent = `❌ Not quite — the answer was ${correctAnswer}`;
      chestZone.innerHTML = '<span class="pop">🔒</span>';
      qText.parentElement.parentElement.classList.add('shake');
      setTimeout(() => qText.parentElement.parentElement.classList.remove('shake'), 400);
    }

    solutionBox.textContent = currentSolution;
    solutionBox.classList.add('show');
  }

  function renderTrail() {
    trail.innerHTML = "";
    history.forEach((h, i) => {
      const s = document.createElement('div');
      s.className = 'step ' + (h ? 'good' : 'bad');
      s.textContent = h ? '★' : '✕';
      trail.appendChild(s);
    });
  }
})();
</script>
</body>
</html>
